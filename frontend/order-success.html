<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionHub | Order Confirmed</title>
    <meta name="description" content="Your FashionHub order has been confirmed." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="container">
        <header class="topbar">
          <a class="brand" href="index.html">LUNORA</a>
          <div class="account-slot" data-account-slot></div>
          <a href="shop.html" class="link-more">Continue shopping</a>
        </header>

        <main class="order-success">
          <section class="success-panel" aria-live="polite">
            <p class="eyebrow">Order confirmed</p>
            <h1>Thank you — your order is on its way</h1>
            <p id="order-message">Loading your order details…</p>

            <div class="order-details" id="order-details"></div>

            <div class="success-actions">
              <a class="btn btn-primary" href="shop.html">Continue shopping</a>
              <a class="btn btn-light" href="index.html">Back to home</a>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module" src="/src/pages/order-success.ts"></script>
  </body>
</html>
